<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pendaftaran Mahasiswa</title>
</head>
<body>

  <h1>Form Pendaftaran Mahasiswa</h1>

  <form>

    <label for="nama">Nama:</label>
    <input type="text" id="nama" name="nama">
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password">
    <br><br>

    <label>Jenis Kelamin:</label>
    <input type="radio" name="jenis_kelamin" value="Laki-laki"> Laki-laki
    <input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan
    <br><br>

    <label>Hobi:</label>
    <input type="checkbox" name="hobi" value="Gaming"> Gaming
    <input type="checkbox" name="hobi" value="Otomotif"> Otomotif
    <input type="checkbox" name="hobi" value="Menonton FILM/ANIME"> Menonton FILM/ANIME
    <input type="checkbox" name="hobi" value="Coding"> Coding
    <br><br>

    <label for="pendidikan">Pendidikan :</label>
    <select id="pendidikan" name="pendidikan">
      <option>D3</option>
      <option>S1</option>
      <option>S2</option>
      <option>S3</option>
    </select>
    <br><br>

    <label for="saran">Kritik dan Saran:</label>
    <br>
    <textarea></textarea>
    <br><br>

    <button>Submit</button>

  </form>

</body>
</html>
